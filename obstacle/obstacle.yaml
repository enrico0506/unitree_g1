# Obstacle slow-down / stop / 360 deg directional gating -- single source of tuning.
# Read by BOTH obstacle_node.py (ROS2, domain 99) and guard.py (dashboard,
# domain 0). Kept OUT of config/robot.yaml on purpose: load_config there
# silently drops unknown sections, and this feature is self-contained.
#
# Distances are metres, angles degrees, rates rad/s or m/s as noted.

# --- obstacle source (which backend writes /dev/shm/g1_obstacle.json) -------
source: lidar   # obstacle/ raw-LiDAR node (run_obstacle.sh)

# --- LiDAR input -----------------------------------------------------------
topic: /livox/lidar          # Livox Mid-360 topic. Our driver runs xfer_format=1 (CustomMsg) --
                             # this build's PointCloud2 path stalls after one frame. The node
                             # auto-detects the type and parses CustomMsg (decimated).
sensor_height_m: 1.20        # Mid-360 height above the floor the robot STANDS on (~10 cm below the
                             # 1.27 m head). NOTE: the tilt-aware floor fit auto-finds the real floor each
                             # frame, so this only sizes the ground-candidate band -- it does NOT need to be
                             # exact. On the HARNESS the robot hangs ~0.3 m up, so the fit reads the floor at
                             # ~-1.5 m (1.2 above the feet + 0.3 harness lift); on the ground it reads ~-1.2.
                             # The published cloud is already x-fwd/y-left/z-up (the driver applies the 180 deg
                             # mount roll), so the floor sits at z ~= -(this + any harness lift).

# --- perception (Stages 2-4) ----------------------------------------------
obstacle_range_m: 3.0        # farthest point we keep (horizontal). MUST be >= slow_at_m, else a
                             # fully-open direction relaxes only to this and never reaches CLEAR / full speed.
slow_at_m: 1.6               # only slow within this -- keeps full speed when it has space (less sensitive)
stop_at_m: 0.6               # stop at/under this distance (per direction). +safety_bubble = effective ~0.75 m.
# --- graduated / natural stop (feel) --------------------------------------
# The slow zone already eases the robot down to ~slow_min*max before it reaches stop_at, so a
# routine wall-approach does NOT need to slam to zero. A stop between emergency_stop_m and
# stop_at now ZEROES the target and lets the jerk/accel shaper ramp it to 0 (smooth, like a
# careful human). Only an obstacle INSIDE emergency_stop_m (fast/sudden/blind approach) keeps
# the instant snap (shaper bypass). FAULT / auto-disable stops stay instant regardless.
emergency_stop_m: 0.30       # raw; +safety_bubble = effective ~0.45 m. Below this a stop SNAPS instantly.
                             # Raise for a firmer/earlier hard stop; lower for a gentler ramp deeper in.
resume_hysteresis_m: 0.12    # once stopped, a direction stays stopped until it clears past
                             # stop_at + this (~0.87 m effective). Kills stop-go chatter at the edge. 0 = off.
smooth_stop: true            # false = legacy behaviour (every stop is an instant snap)
slow_min_scale: 0.18         # MIN speed in the slow zone -> "little steps" when an obstacle is near. As a
                             # direction closes from slow_at down to stop_at the speed eases toward this
                             # floor (~0.18*max = a slow shuffle), so the robot keeps creeping in small
                             # steps instead of stopping dead a metre out. Only the hard stop (inside
                             # stop_at) = 0. Lower (~0.12) for even tinier steps; raise if it won't step.

# --- safety bubble + blind-zone prediction --------------------------------
# The Mid-360 sits ~1.1 m up and tilted ~12 deg UP, so it is BLIND to obstacles
# closer than ~1.0 m straight ahead (MEASURED). Two mitigations:
safety_bubble_m: 0.15        # extra clearance kept on ALL sides beyond the body so the ARMS don't clip
                             # corners. ADDED to slow_at_m + stop_at_m (robot slows/stops this much earlier,
                             # every direction). Lowered 0.35 -> 0.15 so it can creep CLOSER with little
                             # steps before the hard stop (effective stop = stop_at + this = ~0.75 m) instead
                             # of freezing ~1 m out. Raise back toward 0.35 for more arm margin in tight gaps.
front_blind_zone_m: 1.0      # MEASURED front blind distance. A wall approaching head-on VANISHES here;
                             # below this the sensor has no data straight ahead.
predict_blind_zone: true     # dead-reckon a front wall THROUGH the blind cone: when it was last seen near
                             # the blind edge and the robot keeps driving forward, estimate its distance as
                             # (last seen - distance driven) so the front stop still fires. Auto-invalidated
                             # on turning / backing up / after predict_timeout_s (the estimate drifts).
predict_timeout_s: 4.0       # max seconds to trust the dead-reckoned estimate while still creeping forward
# --- ground-plane removal + footprint self-mask (replaces the blunt height band) ---
# A fixed height band cannot tell "flat floor" / "my own legs" / "a real low obstacle"
# apart -- they all sit low and close. Instead we fit the local floor as a TILTED plane
# (so the humanoid's sway doesn't fool a fixed z threshold), drop everything near that
# plane, and separately mask out the robot's own footprint box by POSITION (not height).
# A harness pole / gantry foot OUTSIDE the footprint that sticks up from the floor is
# then KEPT even when it is low and close.
ground_removal: true         # true = plane removal + footprint mask (below). false = legacy height band.
ground_clearance_m: 0.08     # keep points sticking up MORE than this above the fitted floor (floor itself drops)
ground_band_m: 0.5           # floor-candidate points are below sensor_height+this (used only to FIT the plane)
ground_min_points: 80        # need >= this many candidates to fit a plane (else assume a level floor)
# Robust floor fit (BUG 1 fix): the floor is the LOWEST surface, so we seed the plane from a LOW
# percentile of candidate z and iteratively refit only over points near/below that plane. This stops a
# dense low overhang (table underside / gantry) that slipped into the candidate band from dragging the
# fitted plane UP and tilting it -- which used to delete the overhang itself as "floor" (torso hazard MISSED).
floor_seed_percentile: 25.0  # seed the plane offset from this z-percentile of candidates (low = the floor)
floor_inlier_band_m: 0.12    # each refit keeps candidates within +/- this of the current plane (reject above)
floor_fit_iters: 3           # seed-then-refit iterations (more = tighter convergence on the lowest surface)
obstacle_max_above_m: 1.9    # cut points higher than this above the floor (ceiling / overhead)
self_front_m: 0.35           # footprint self-mask: forward extent (covers a forward leg swing) -- MEASURE/tune
self_back_m: 0.35            # footprint self-mask: rearward extent -- MEASURE/tune
self_half_width_m: 0.30      # footprint self-mask: half-width (covers the leg stance) -- MEASURE/tune
# Self-mask height limit (BUG 2 fix): the footprint mask is a box around the base; WITHOUT a height limit
# it deletes ALL heights in that column, so a real obstacle at chest/head height directly above the feet
# vanishes. Only mask LOW returns (legs/feet) below this height above the fitted floor; keep overhead.
self_mask_max_height_m: 0.6  # mask footprint returns only below this height above floor (legs); higher = real hazard

# --- legacy height band (used ONLY when ground_removal is false) -------------------
min_height_m: -0.4           # height band lower edge (sensor-relative z): cuts the FLOOR and the robot's
                             # own legs / lower body / swinging feet so they aren't read as obstacles.
                             # Raise toward -0.2 if it still sees its legs; lower to detect lower obstacles.
max_height_m: 0.50           # height band upper edge (cuts ceiling / overhead)
blind_radius_m: 0.45         # drop self-returns / points closer than this
min_cluster_points: 10       # k: the k-th closest point is the robust nearest (1 = noise)
filter_alpha: 0.25           # legacy symmetric EMA (kept for reference; the wedges now use the asym filter below)
# --- asymmetric per-direction wedge filter: "fast to fear, slow to trust" ---------------
# The Mid-360 scans NON-REPETITIVELY, so a sparse petal occasionally reads a wedge FARTHER
# than it is (a one-frame false-CLEAR spike, e.g. front 1.25 -> 1.75) -- a symmetric EMA lets
# that leak through and the "distance in front changes the whole time". Instead: a CLOSER raw
# reading (a real obstacle approaching) is adopted (near-)INSTANTLY, so the stop latency is
# UNCHANGED and a direction is never wrongly believed clear; a FARTHER reading is trusted only
# SLOWLY and is first clamped to a short temporal MEDIAN of recent raws, so a lone one-frame far
# spike is rejected outright. Frame-rate INDEPENDENT (the median is over frames, not seconds), so
# it still holds when battery sag throttles the CPU and the frame rate drops. Applies to all 4 wedges.
wedge_near_alpha: 1.0        # EMA weight when the new reading is CLOSER (1.0 = adopt instantly = "fear")
wedge_far_alpha: 0.05        # EMA weight when the new reading is FARTHER (small = a far jump is trusted very slowly)
wedge_median_n: 5            # temporal median window (frames) per direction; rejects a single-frame far false-clear
ease_scale: true             # node: smoothstep S-curve for distance->scale (false = linear ramp)
tight_open_m: 1.2            # node: a direction starts counting as "closing in" below this
tight_min: 0.7              # node: floor of the global tight-space multiplier (gentle: 70% when boxed in)
scale_slew_per_s: 1.8        # guard: max change in the applied speed-scale per second (smoothness)

# --- announcements (Stage 5) ----------------------------------------------
announce_cooldown_s: 3.0     # min seconds between repeats of the same announcement
speaker_id: 0                # AudioClient TtsMaker speaker id
led_warnings: true           # tint the robot LED orange (slow) / red (stop)

# --- fail-safe (the agreed behaviour) -------------------------------------
stale_timeout_s: 1.0         # no fresh frame for this long while enabled -> FAULT
startup_grace_s: 8.0         # after enabling, wait this long for the first frame before faulting
fault_stop_s: 3.0            # on FAULT: stop forward for this long, announce, then auto-disable

# --- ring-corridor geometry (used by the guard's 360 deg directional gating) ---
robot_half_width_m: 0.25     # half the G1 body width -- MEASURE. Sizes the swept corridor.
clearance_margin_m: 0.10     # extra room demanded on each side of the travel corridor

# --- full-circle 360 deg ring ---------------------------------------------
# A self-describing per-sector distance ring over the WHOLE circle, ADDED to the
# contract alongside the 4 wedges. The obstacle node bins ALL kept points into
# 360/ring_bin_deg sectors and writes ring={n,bin_deg,start_deg,dist[]}
# (angle=atan2(y,x): 0=ahead, +=LEFT, -=RIGHT). Consumed by the guard's 360 deg
# directional braking (below) + the dashboard polar radar. PERCEPTION keys:
ring_bin_deg: 5.0            # ring angular resolution -> 72 sectors over 360 deg
ring_min_points: 3           # LiDAR: points needed before a sector reads a distance
                             # (the costmap node uses its own ring_min_cells: 1 -- one lethal cell = real)
# Near-field tripwire (BUG 3 fix): a wide+sparse hazard (taut cable, barrier tape, thin railing) can give
# FEWER than ring_min_points per 5 deg sector AND fewer than min_cluster_points per 90 deg wedge -- invisible
# to both ring and wedge, yet right in the robot's path. So any sector with >= tripwire_min_points within
# tripwire_range_m reports its NEAREST point regardless of the ring_min count. Kept NEAR-FIELD only (range
# gate) so a couple of stray FAR returns can't trip it -- the far-field count threshold is unchanged.
tripwire_range_m: 1.6        # only fire the tripwire for returns within this range (near-field; ~= slow_at_m)
tripwire_min_points: 2       # min returns inside tripwire_range to fire (1 = a single close return is a hazard)

# --- 360 deg directional braking (GUARD keys; falls back to the 4-wedge logic
#     whenever the JSON has no "ring", e.g. an old node or the costmap source) --
ring_gating: true            # gate vx/vy by the ring in the TRAVEL direction (atan2(vy,vx)).
                             # false OR a ring-less JSON -> legacy per-axis 4-wedge braking, unchanged.
direction_cone_deg: 25.0     # min half-angle (each side of the travel heading) of the gating cone (floor)
direction_cone_max_deg: 70.0 # cap on the AUTO-WIDENED cone half-angle. A near obstacle subtends a wide
                             # angle (body width / range) so the cone widens with closeness; this cap stops
                             # a ~0.05 m return blowing it up to near-omnidirectional and freezing all motion.
front_blind_compose_deg: 30.0 # travel headings within this of straight-ahead ALSO honour the front
                             # blind-zone predictor: gate on min(ring_cone_min, predicted_front).
ring_min_motion: 0.03        # |translational command| below this -> no ring gating (no direction to aim)

# --- defaults (opt-in; flipped from the dashboard at runtime) --------------
enabled_default: false       # obstacle guard OFF until the operator turns it on
publish_hz: 10               # node processing / shm-write rate (matches LiDAR)

# --- dashboard 3D obstacle sphere -----------------------------------------
# The node exports the kept obstacle points (post ground/self/range filter) so the
# 3D sphere can voxelise them into solid columns. These are EXACTLY what the guard
# reacts to -- low things on the ground show as short blocks; blind spots show as
# empty space (no returns). z is height ABOVE the fitted floor (floor = 0).
viz_points: true             # false = stop exporting points (saves a little WLAN/CPU)
viz_max_points: 3000         # cap on exported points (~2.5k kept/frame -> 3000 sends all).
                             # Lower if the dashboard lags over WiFi; raise for max density.
# Rolling accumulation (fixes the "radar sweep"): the Mid-360 scans NON-REPETITIVELY,
# so a single ~100 ms frame paints only a thin "petal" -- per-frame the 2D ring + 3D
# sphere show a sparse arc that SWEEPS the circle and flickers. Merging the last
# viz_accum_s of frames before building the ring + points yields a full, steady cloud.
# The front/left/right/back SAFETY wedges + zone stay per-frame (the hard stop keeps its
# latency); only the ring + sphere use the merged window. NOTE: the ring feeds the guard's
# 360 deg gating, so this ALSO densifies that gating -- fail-safe: a cleared sector lingers
# up to viz_accum_s (conservative directional braking, never blind).
viz_accum_s: 0.6             # merge window (s); 0 = off (old per-frame sweep). ~0.6 = full circle.
                             #   (Tried 1.0 to hold a sparse pole longer -> over-accumulated sway/edge
                             #   returns all round and boxed the robot in. Back to 0.6; the pole is
                             #   better solved by occ_l_high noise-rejection than a wider window.)
viz_accum_max_frames: 12     # hard cap on buffered frames (memory/CPU; ~1.2 s @ 10 Hz)

# --- 3D sphere stabilisation (viz-only; SEPARATE from the ring window above) ------
# The sphere flickered badly (MEASURED live: 46% of voxels vanished frame-to-frame,
# 27% seen in a single frame -> "appear/disappear") and looked tilted. Fixed WITHOUT
# touching the safety ring/wedges/guard:
#   * LEVEL each frame by the IMU-gravity vector (absolute vertical + EMA-smoothed ->
#     stable; removes the ~12 deg mount tilt without the per-frame floor-fit wobble),
#     then anchor the fitted floor to z=0.
#   * accumulate the last viz_win_s of LEVELED frames and VOXEL-downsample to a fixed
#     grid so points snap to stable cell centres and persist across the non-repetitive
#     scan's petals (MEASURED: Jaccard 0.42 -> ~0.86, one-frame voxels 27% -> 4%).
# Emits a small "viz_dbg" into the shm (src / n_raw / n_out / frames / z0) so the
# leveling source + density are observable on the dashboard.
viz_win_s: 1.0               # 3D-sphere accumulation window (s); ~5 frames @ 10 Hz. Bigger
                             #   = steadier + denser but smears more while WALKING (viz only).
viz_win_max_frames: 16       # hard cap on buffered sphere frames (memory/CPU)
viz_voxel_m: 0.10            # sphere voxel-grid cell (m): stable positions + bounded count.
                             #   Smaller = finer/denser (more points); 0.10 balances detail vs steadiness.
# Voxel TIME-PERSISTENCE (fixes the residual "appear/disappear" at a LOW/variable frame rate):
# the plain viz_win_s union is only ~5 sparse Mid-360 petals @ ~5 Hz, so boundary voxels flip
# on/off frame-to-frame. Instead we STAMP each occupied voxel cell with the time it was last
# seen and EMIT every cell seen within viz_hold_s -- independent of how many frames actually
# landed this window -- so the cloud stays steady no matter the rate (it survives CPU throttling
# under battery sag). Mirrors the log-odds ring's decay, but simpler (one stamp per cell). A hard
# cap bounds memory. Cosmetic only (no safety path reads these points). viz_dbg gains a "cells" count.
viz_hold_s: 0.8             # emit any voxel cell seen within this many seconds (0 = current frame only)
viz_cell_cap: 6000          # hard cap on persisted cells (memory bound); over cap drops the OLDEST-seen first
# Sphere leveling = FIXED mount-tilt correction. The head/Mid-360 is bolted nose-up at
# a CONSTANT angle, so the sphere just rotates the cloud by that fixed plane. We do NOT
# use the per-frame floor fit: MEASURED, at this steep up-tilt the sensor barely sees
# the floor, so the fit returns "level" (a=b=0) and applies NO correction -> the raw
# tilt showed through (floor dipping below in front, rising behind). A constant is
# stable and needs no floor visibility. Tune the two angles until the floor looks flat.
viz_mount_pitch_deg: 28.0    # head nose-up tilt removed in the sphere (MEASURED ~28deg). If the floor
                             #   still dips toward the FRONT raise this; if it dips toward the BACK lower it.
viz_mount_roll_deg: 0.0      # head roll removed in the sphere (+ = right side down); usually ~0
viz_detilt_pct: 20.0         # low z-percentile used only to REPORT the residual floor tilt (diagnostic)
viz_floor_clip_m: 0.0        # drop sphere points more than this BELOW the leveled floor (0 = keep all;
                             #   real floor objects sit at ~z=0, so leave OFF now that leveling is fixed).

# --- log-odds occupancy ring (obstacle-precision: stable + 3-state) ---------
# The raw per-sector ring feeds a log-odds occupancy grid so the ring is stable
# (no flicker), self-clears, and reports honest occupied / free / UNKNOWN. The
# emitted distance = min(occupancy, raw), so gating is never LESS conservative
# than the current scan. occ_decay_s = how long a sector HOLDS an obstacle between
# returns. occ_l_high = log-odds a sector must reach to count as OCCUPIED: with
# occ_l_occ=0.85 per return, 0.85 = ONE return marks it (noisy -> boxed the robot
# in); 1.7 requires TWO returns (rejects lone stray/sway points). Raise occ_l_high
# to de-phantom; raise occ_decay_s to hold sparse obstacles longer (do it only
# WITH the higher l_high, or phantoms persist). use_occupancy:false -> raw ring.
use_occupancy: true          # false = legacy raw per-frame ring
occ_decay_s: 0.7             # occupancy hold/decay time constant (s)
occ_l_high: 1.5              # log-odds to mark a sector OCCUPIED (~2 returns; 0.85 = 1 return = noisy)
occ_r_bin_m: 0.05            # occupancy radial bin size (m)
use_deskew: true             # IMU-gyro motion-compensate the cloud (needs /livox/imu; else identity)

# --- D435i depth fusion (fills the Mid-360's near-GROUND blind zone) -------
# The head RealSense D435i is tilted ~47 deg DOWN, so it sees the floor ~0.5-2 m
# in front -- exactly where the up-looking Mid-360 is blind. DepthNearField
# (scripts/depth_nearfield.py) reuses the dashboard's already-decoded depth cloud
# (no second camera open), corrects the mount pitch, drops the floor, and reports
# the nearest forward near-ground obstacle. The guard mixes it into the forward
# distance (slow + stop). Depth fusion is now ALWAYS ON -- the runtime toggle has
# been removed (validated on the robot); enabled stays true here as the single
# permanent switch. Watch depth.front_near in the telemetry to sanity-check the frame.
depth_fusion:
  enabled: true              # ALWAYS ON (toggle removed); leave true -- a bad depth frame can false-stop
  pitch_deg: 52.0            # D435i downward mount tilt. URDF d435_joint nominal is 47.6 deg
                             # (0.83078 rad), but MEASURED live the floor RAMPED ~+0.12 m across the
                             # 0.5-2 m band (telemetry floor_ramp_m) -> a low object at range read ~16 cm
                             # too HIGH. That ramp = a ~4-5 deg pitch shortfall (the real head pose tilts
                             # the cam DOWN more than nominal), so raised 47.6 -> 52.0. TUNE by minimising
                             # floor_ramp_m: if a floor object still shows too HIGH (floor ramps UP with
                             # range) RAISE this; if it now dips too LOW (ramps down) LOWER it. Analogous
                             # to viz_mount_pitch_deg for the Mid-360 sphere -- a SEPARATE knob.
  camera_height_m: 1.30      # real D435i height above the floor -- MEASURE (head ~1.27 m)
  corridor_half_m: 0.35      # forward corridor half-width (robot half-width + margin)
  min_range_m: 0.35          # ignore closer than the D435i min range (~0.3 m)
  max_range_m: 2.5           # only fuse the NEAR band (beyond this the lidar is fine)
  ground_clearance_m: 0.08   # keep points more than this above the floor (drop the floor)
  max_height_m: 1.8          # drop overhead / ceiling returns
  min_points: 8              # need >= this many near points before reporting (anti-noise)
  kth: 4                     # report the k-th nearest forward distance (reject a lone flier)
  poll_hz: 15                # depth sampling rate
  # per-sector depth ring -- fills the front blind wedge across ALL forward sectors, merged
  # into the lidar ring by NaN-aware min (depth only lowers a sector, never clears it).
  ring_bin_deg: 5.0          # MUST equal the lidar ring_bin_deg above, or the merge is skipped
  ring_fov_half_deg: 43.0    # D435i horizontal half-FOV (~87 deg HFOV) actually imaged
  ring_min_points: 2         # min near points in a 5 deg sector before it reports
  ring_ground_clearance: 0.03  # SMALL-OBJECT floor: ring sees cables/cords >~3 cm tall on the
                             #   floor (scalar corridor keeps 0.08). RAISE toward 0.05 if a
                             #   noisy/specular floor false-triggers; LOWER risks floor noise.
