# =============================================================================
# g1_nav circle-patrol + person-interaction tuning.
# =============================================================================
# Single source of truth for the NEW Track A nodes (circle_patrol.py,
# fused_odom_health.py, person_fusion.py, patrol_supervisor.py). Mirrors the
# obstacle/obstacle.yaml convention used elsewhere in this repo: every value
# here has a BAKED-IN default in code, so a missing file or missing key never
# crashes a node -- this file only overrides.
#
# SCAFFOLD: several values are placeholders pending real-robot tuning (marked
# <ASK ENRICO> / <TUNE>). None of this drives real motion until g1_cmd_vel_bridge
# is enabled (use_bridge:=true) -- see MIGRATION_STATUS.md.

circle_patrol:
  radius_m: 3.0                # patrol circle radius (plan default)
  lookahead_m: 1.25            # pure-pursuit carrot lookahead, 1.0-1.5 m per the plan
  direction: 1                 # +1 = CCW, -1 = CW
  goal_resend_hz: 1.0          # cancel+resend a fresh NavigateToPose goal at this rate
                                # (plan's stated design: simpler/more robust than trying
                                # to keep one goal alive indefinitely)
  odom_topic: "/Odometry"      # FAST-LIO odometry (nav2_params.yaml bt_navigator odom_topic)
  global_frame: "odom"         # matches nav2_params.yaml local_costmap global_frame
  robot_base_frame: "base_link"
  action_name: "navigate_to_pose"
  handoff_stale_s: 2.0         # <TUNE> if patrol_supervisor's handoff heartbeat is older
                                # than this, FAIL OPEN and resume driving (see circle_patrol.py
                                # docstring for the safety tradeoff this encodes)

fused_odom_health:
  publish_hz: 5.0
  min_confidence: 0.35         # <TUNE> FusedOdometry.get_state()['confidence'] floor
  interface: "eth0"            # Unitree DDS interface (leg+imu), domain 0
  lio_topic: "/Odometry"       # FAST-LIO nav_msgs/Odometry, ROS2 domain 99

person_fusion:
  close_distance_m: 1.6        # <TUNE> "person nearby" trigger distance for patrol_supervisor
  min_conf: 0.35                # DETECT_TRACKS item confidence floor
  depth_min_points: 5           # min cloud points in a box's bearing window before
                                 # trusting a distance (else distance_m: null)
  depth_shm_stale_s: 1.0        # depth cloud shm considered dead past this age
  detect_demand_hz: 2.0         # DETECT_DEMAND heartbeat touch rate (keeps detector inferring)

patrol_supervisor:
  person_debounce_s: 1.0       # <TUNE> person must be continuously close this long before
                                # circling -> pausing fires (kills single-frame false triggers)
  person_lost_grace_s: 2.0     # how long a person may be briefly lost before we give up
                                # facing/waving early
  pause_settle_s: 0.3          # pausing's own settle window before facing starts commanding
                                # cmd_vel -- gives circle_patrol.py a tick to see the handoff
                                # and cancel its own goal first (avoid two simultaneous /cmd_vel
                                # writers racing on the very first tick of a takeover)
  close_box_frac_h: 0.55       # <TUNE> box-height / frame-height fallback "looks close" proxy,
                                # used ONLY when person_fusion's distance_m is null (see that
                                # node's docstring -- the common case until its depth-export
                                # follow-up lands); reuses the plan's own Track C box-heuristic
                                # pattern rather than inventing a new one
  cmd_vel_topic: "/cmd_vel"    # SAME topic g1_cmd_vel_bridge.py subscribes -- see that file
  tick_hz: 10.0
  person_track_stale_s: 1.0    # g1_person_track.json considered dead past this age
  yaw_kp: 1.2                  # P-controller gain, bearing error (rad) -> vyaw (rad/s)
  yaw_max_rad_s: 0.6           # <ASK ENRICO> safe autonomous in-place yaw rate
  yaw_tolerance_rad: 0.09      # ~5 deg; "yaw error is small" threshold for facing -> waving
  yaw_settle_s: 0.3            # must be within tolerance for this long (debounce)
  facing_timeout_s: 6.0        # give up converging and wave anyway (never dead-end facing)
  wave_gesture: "high_wave"    # OPEN_GESTURES name sent over WS -- NOT "wave" (native
                                # LocoClient.WaveHand() is a dead no-op on this G1; see
                                # scripts/gesture_reactor.py's GESTURE_TO_ROBOT comment)
  wave_busy_s: 3.5              # matches robot_web_controller._ARM_BUSY_S["wave"]... note
                                # high_wave's actual entry is also 3.5s; kept as a fallback
                                # wait if the WS ack round-trip is unavailable
  waiting_timeout_s: 8.0       # waving -> waiting -> resuming timeout if the person never leaves
  ws_url: "ws://127.0.0.1:8080/ws"   # robot_web_controller's own /ws (config/robot.yaml
                                       # server.port); connects as a plain, unauthenticated
                                       # client -- see patrol_supervisor.py docstring
  ws_connect_timeout_s: 2.0

# Track A Extension -- Exhibition Mode (roam + gesture + on-request dance, inside
# the 3 m disc). See the plan file's "Track A Extension" section for the full
# design rationale; consumed by g1_nav/g1_nav/nodes/exhibition_conductor.py and
# the pure oracle functions at the bottom of g1_nav/g1_nav/patrol_logic.py
# (random_point_in_disc / ExhibitionSegment / predict_segment_end /
# plan_next_segment). circle_patrol.py itself is untouched and remains the
# simpler fallback node (launch-time choice via `enabled` below, not a live
# dashboard toggle in v1).
exhibition:
  enabled: true                  # if false, launch circle_patrol.py instead
  edge_clearance_m: 0.5          # <TUNE> minimum clearance from the 3 m disc boundary
  roam_speed_mps: 0.5            # <ASK ENRICO> safe autonomous roam speed (well under
                                  # the hardware vx cap) -- also used to size roam segment
                                  # durations (distance / this speed)
  roam_min_dist_m: 0.8           # don't bother roaming somewhere this close to current
                                  # position -- avoids pointless few-cm "roams"
  lookahead_segments: 5          # oracle preview horizon (per the plan)
  max_reroll_attempts: 8
  gesture_duration_s: 3.5        # matches robot_web_controller._ARM_BUSY_S for most gestures
  idle_duration_s: 1.0
  min_segment_gap_s: 1.5         # brief settle between segments (mirrors patrol_supervisor's
                                  # pause_settle_s -- gives things one tick to visibly stop)
  tick_hz: 10.0                  # decision-loop tick rate, same order as patrol_supervisor's
  goal_timeout_slack_s: 5.0      # <TUNE> roam segments are considered "stuck" (and abandoned
                                  # back to idle) after duration_s + this slack, so a
                                  # rejected/wedged NavigateToPose goal can never freeze the
                                  # conductor forever
  dance_request_stale_s: 120.0   # a dashboard dance request older than this is dropped
                                  # (operator likely forgot about it / left) -- see
                                  # exhibition_conductor.py's pending-dance polling
  dance_default_duration_s: 8.0  # <TUNE> PLACEHOLDER: no authoritative "how long does dance
                                  # 503 take" value exists anywhere in this codebase yet
                                  # (its dances.yaml catalog note only says it "plays the
                                  # classic dance and returns to walk on its own"); used as
                                  # the wait time before the conductor returns to idle after
                                  # firing a dance
  # Dance is deliberately NOT in this weighted pool -- see plan decision #3
  # (dances are only ever requested by the dashboard via
  # /dev/shm/g1_exhibition_dance_request.json, never drawn at random here).
  segments:
    - kind: roam
      weight: 0.45
    - kind: gesture
      weight: 0.35
      choices: ["high_wave", "high_five", "heart", "clap", "kiss"]   # subset of
                                  # OPEN_GESTURES excluding "hug" (needs a person) and
                                  # "shake" (also a handshake gesture, needs a person)
    - kind: idle
      weight: 0.20
