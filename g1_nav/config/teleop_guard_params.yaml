# =============================================================================
# Nav2 params for the Unitree G1  --  ROS 2 FOXY  --  TELEOP-GUARD COSTMAP SOURCE
# =============================================================================
# DERIVED FROM config/nav2_params.yaml. This variant exists for the TELEOP GUARD:
# the operator drives with W/A/S/D on the dashboard, and we run JUST the Nav2 local
# costmap so costmap_to_obstacle can turn it into per-direction obstacle distances
# in /dev/shm/g1_obstacle.json (the SAME file the dashboard ObstacleGuard reads).
# The planner/controller OUTPUT is UNUSED here -- there is NO autonomous motion and
# NO /cmd_vel bridge. We still bring the planner/controller/bt/recoveries servers up
# because the lifecycle_manager needs them to activate (and the controller_server is
# what owns + activates the local_costmap we sample).
#
# DELTA vs nav2_params.yaml (everything else is byte-identical):
#   * local_costmap  global_frame  odom -> camera_init   (FAST-LIO world frame)
#   * local_costmap  robot_base_frame  base_link -> body (FAST-LIO robot frame)
#   * local_costmap  stvl source  min/max_obstacle_height -> -2.0 / 2.0
#       (ground is PRE-REMOVED by ground_seg, so DON'T height-clip the cloud)
#   * local_costmap  stvl  update_footprint_enabled: true  (clear the robot's own
#       footprint so its legs/feet don't self-mark)  -- already present below
#   * global_costmap global_frame/robot_base_frame -> camera_init / body
#   * controller_server / planner_server / bt_navigator / recoveries_server frame
#       references  odom -> camera_init,  base_link -> body  (so the lifecycle TF
#       lookups resolve against FAST-LIO's native frames)
#
# Pipeline this file is the heart of:
#   Mid-360 (Livox CustomMsg)
#     -> FAST-LIO -> /cloud_registered (camera_init)
#     -> ground_seg -> /patchwork/nonground (camera_init, floor removed)
#     -> Nav2 local costmap (STVL) -> costmap_to_obstacle -> /dev/shm/g1_obstacle.json
#     -> the EXISTING dashboard guard/UI/voice/overlay (reused UNCHANGED)
#
# NO MAP. NO localization. Pure rolling local costmap in FAST-LIO's `camera_init`
# frame, fed by FAST-LIO's camera_init->body TF and /Odometry.
#
# SCAFFOLD: many values below are PHYSICAL and MUST be measured on the real robot.
# They are flagged inline as  <ASK ENRICO: ...>.  Do NOT guess them.
#
# Frames (FAST-LIO NATIVE -- used directly, NO rename):
#   camera_init  FAST-LIO world / global frame (costmap global_frame)
#   body         FAST-LIO IMU/robot frame (costmap robot_base_frame)
#   (FAST-LIO broadcasts camera_init->body TF and /Odometry[camera_init,body])
#
# Run env: source /home/unitree/g1_mapping_ws/env.sh  (ROS_DOMAIN_ID=99, CycloneDDS)
#
# #############################################################################
# # !!! STVL IS *NOT* INSTALLED ON THIS FOXY ROBOT !!!                        #
# #                                                                           #
# # Only `nav2_voxel_grid` ships here; the                                    #
# # `spatio_temporal_voxel_layer` (STVL) plugin used by local_costmap below   #
# # WILL FAIL TO LOAD until you do ONE of the following:                      #
# #                                                                           #
# #  (A) PREFERRED -- source-build STVL for Foxy and overlay it:              #
# #        git clone -b foxy-devel \                                          #
# #          https://github.com/SteveMacenski/spatio_temporal_voxel_layer \   #
# #          ~/g1_mapping_ws/src/spatio_temporal_voxel_layer                  #
# #        (needs OpenVDB; `sudo apt install libopenvdb-dev` on this Jetson,  #
# #         else build OpenVDB from source) then colcon build & re-source.    #
# #      Keeps the temporal voxel decay = the 4 s blind-spot MEMORY this      #
# #      whole design depends on (G1 has a Mid-360 blind cone under its feet; #
# #      decay lets a just-seen obstacle persist after it leaves the FOV).    #
# #                                                                           #
# #  (B) DEGRADED FALLBACK -- swap STVL for the built-in VoxelLayer.          #
# #      LOSES the temporal / blind-spot memory (obstacles clear the instant  #
# #      they leave the sensor FOV -> the G1 can forget a thing right before  #
# #      it steps on it). Only acceptable for a first smoke-test.             #
# #      The exact drop-in replacement is given, COMMENTED OUT, at the bottom #
# #      of the local_costmap plugins block (search "FALLBACK VoxelLayer").   #
# #############################################################################

# -----------------------------------------------------------------------------
# LOCAL COSTMAP  --  the only costmap that matters in map-free mode
# -----------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0          # Hz; costmap refresh
      publish_frequency: 2.0         # Hz; for RViz / debugging
      global_frame: camera_init      # FAST-LIO world frame (was odom)
      robot_base_frame: body         # FAST-LIO robot frame (was base_link)
      rolling_window: true           # window follows the robot (map-free)
      width: 6                       # m
      height: 6                      # m
      resolution: 0.05               # m/cell
      # transform_tolerance generous: FAST-LIO TF on a swaying humanoid can lag.
      transform_tolerance: 0.5

      # --- FOOTPRINT (top-down body outline polygon, base_link frame, metres) ---
      # CCW points; (x fwd, y left).
      # G1 body is ~0.45 m wide x ~0.20 m deep (Unitree spec, 1320x450x200 mm).
      # Box below = half-depth 0.20 (x) x half-width 0.25 (y): the 0.20 m body
      # depth + ~0.10 m fore/aft swing margin, and the 0.45 m shoulder width
      # + ~0.025 m each side. VERIFY: a swaying biped's feet swing wider than the
      # torso -- if the gait clips obstacles, widen y or switch to a 0.30 m circle.
      footprint: "[[0.20,0.25],[0.20,-0.25],[-0.20,-0.25],[-0.20,0.25]]"
      footprint_padding: 0.0         # add margin here OR bake it into inflation_radius

      plugins: ["stvl_layer", "inflation_layer"]

      # -----------------------------------------------------------------------
      # STVL  --  Spatio-Temporal Voxel Layer  (SEE THE BIG WARNING AT TOP)
      # NOT installed on this robot. Source-build it (option A) or use the
      # commented FALLBACK VoxelLayer below (option B, loses temporal memory).
      # -----------------------------------------------------------------------
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_size: 0.05             # m; match costmap resolution
        voxel_decay: 4.0             # s of BLIND-SPOT MEMORY -- how long a voxel
                                     # persists after it stops being observed.
                                     # This is the whole point of using STVL on
                                     # the G1 (under-foot blind cone). Do not zero.
        decay_model: 0               # 0 = linear decay (also: 1 exponential, 2 persistent)
        track_unknown_space: true    # unobserved = unknown (not free)
        mark_threshold: 0            # voxels needed in a column to mark occupied
        unknown_threshold: 15
        update_footprint_enabled: true
        combination_method: 1        # 1 = max (obstacle layer semantics)
        obstacle_range: 5.0          # m; default mark range (per-source overrides below)
        origin_z: 0.0                # m; bottom of the voxel grid
        publish_voxel_map: false     # true only for debugging (heavy)
        mapping_mode: false
        observation_sources: "lidar_nonground"   # realsense is Phase-3/OFF (single-open /dev/video0);
                                                  # re-add "realsense" here when realsense_cloud_pub runs.

        # --- SOURCE 1: Patchwork++ non-ground cloud (Mid-360) -- PRIMARY ----
        lidar_nonground:
          data_type: PointCloud2
          topic: /patchwork/nonground   # PINNED
          marking: true
          clearing: true
          # --- min/max_obstacle_height: -2.0 / 2.0 (NO height clip) ----------
          # ground_seg already REMOVED the floor (camera_init frame), so the cloud
          # this consumes is pure obstacles. We therefore do NOT height-clip it:
          # in camera_init the robot can pitch/sway and points span a wide z, and
          # clipping would silently drop real low obstacles. A wide band keeps
          # every non-ground return. (The raw-lidar node's height band is gone --
          # ground removal is the floor filter now.)
          min_obstacle_height: -2.0     # m -- no low clip (ground is pre-removed)
          max_obstacle_height: 2.0      # m -- no high clip
          obstacle_range: 5.0           # m; mark obstacles within this
          # raytrace/clearing range -- clear voxels along the beam to this far:
          clear_after_reading: true     # drop the buffer each cycle (decay handles memory)
          # vertical/horizontal FOV: Mid-360 is ~ full 360 H, leave wide.
          vertical_fov_angle: 1.57      # rad (~90 deg); Mid-360 has a wide vertical FOV
          horizontal_fov_angle: 6.28    # rad (~360 deg) Mid-360 is omnidirectional

        # --- SOURCE 2: RealSense depth cloud -- OPTIONAL, OFF UNTIL PHASE 3 --
        # OPTIONAL / OFF by default. The RealSense depth comes from raw V4L2 on
        # /dev/video0 (Z16), which is SINGLE-OPEN: it CANNOT be read while the
        # dashboard is using the camera (V4L2 conflict). So realsense_cloud_pub
        # is a Phase-3 node and this source contributes nothing until then.
        # To truly disable it now, also remove "realsense" from
        # observation_sources above. Left listed so the wiring is documented.
        realsense:
          data_type: PointCloud2
          topic: /camera/points         # PINNED (realsense_cloud_pub output, Phase 3)
          marking: true
          clearing: true
          min_obstacle_height: 0.02      # m
          max_obstacle_height: 2.0       # m
          obstacle_range: 3.0            # m
          # G1 head camera = Intel RealSense D435i (Unitree G1 dev guide).
          # D435/D435i DEPTH FOV per Intel datasheet: 87 deg H x 58 deg V.
          vertical_fov_angle: 1.0123      # rad = 58 deg (D435i depth, Intel datasheet)
          horizontal_fov_angle: 1.5184    # rad = 87 deg (D435i depth, Intel datasheet)
          clear_after_reading: true

      # -----------------------------------------------------------------------
      # FALLBACK VoxelLayer  (option B)  --  UNCOMMENT THIS WHOLE BLOCK AND
      # COMMENT OUT stvl_layer ABOVE if you cannot source-build STVL.
      # Also change the plugins line to:
      #     plugins: ["obstacle_layer", "inflation_layer"]
      # WARNING: NO temporal decay -> NO blind-spot memory. Obstacles vanish the
      # instant they leave the sensor FOV. Smoke-test only.
      # -----------------------------------------------------------------------
      # obstacle_layer:
      #   plugin: "nav2_costmap_2d::VoxelLayer"   # or "nav2_costmap_2d::ObstacleLayer" for 2D
      #   enabled: true
      #   publish_voxel_map: false
      #   origin_z: 0.0
      #   z_resolution: 0.05
      #   z_voxels: 16
      #   max_obstacle_height: 2.0
      #   mark_threshold: 0
      #   combination_method: 1
      #   observation_sources: lidar_nonground realsense
      #   lidar_nonground:
      #     topic: /patchwork/nonground
      #     data_type: "PointCloud2"
      #     marking: true
      #     clearing: true
      #     min_obstacle_height: 0.03      # SAME floor-object fix -- DO NOT RAISE
      #     max_obstacle_height: 2.0
      #     obstacle_range: 5.0
      #     raytrace_range: 5.5
      #   realsense:                        # OPTIONAL / OFF until Phase 3 (V4L2 conflict)
      #     topic: /camera/points
      #     data_type: "PointCloud2"
      #     marking: true
      #     clearing: true
      #     min_obstacle_height: 0.02
      #     max_obstacle_height: 2.0
      #     obstacle_range: 3.0
      #     raytrace_range: 3.5

      # -----------------------------------------------------------------------
      # INFLATION
      # -----------------------------------------------------------------------
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # inflation_radius = robot inscribed radius + safety margin.
        inflation_radius: 0.40        # m  = footprint inscribed radius ~0.20 + ~0.20 margin (G1 0.45x0.20 body). VERIFY against real swept width.
        cost_scaling_factor: 3.0      # higher = costs fall off faster from obstacles

  # Costmap nodes need their own clock alias under Foxy bringup:
  local_costmap_client:
    ros__parameters:
      use_sim_time: false
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

# -----------------------------------------------------------------------------
# GLOBAL COSTMAP  --  UNUSED in map-free mode (kept minimal/rolling so NavFn,
# which always instantiates a global costmap, has a valid one). It is a small
# rolling window in odom with the SAME local sources, so a short "global" plan
# to a nearby relative goal still avoids obstacles. There is NO static map layer.
# -----------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: camera_init      # FAST-LIO world frame (was odom); no map
      robot_base_frame: body         # FAST-LIO robot frame (was base_link)
      rolling_window: true           # rolling, map-free
      width: 12                      # m; a bit larger than local so plans have room
      height: 12
      resolution: 0.05
      transform_tolerance: 0.5
      footprint: "[[0.20,0.25],[0.20,-0.25],[-0.20,-0.25],[-0.20,0.25]]"   # SAME as local_costmap (G1 0.45x0.20 body + margin)
      footprint_padding: 0.0
      # Reuse the same obstacle source. If STVL is source-built you may list
      # stvl_layer here too; for the global rolling costmap the built-in
      # ObstacleLayer is lighter and sufficient. Left minimal on purpose.
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar_nonground
        lidar_nonground:
          topic: /patchwork/nonground
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.03   # SAME floor-object fix -- DO NOT RAISE
          max_obstacle_height: 2.0
          obstacle_range: 5.0
          raytrace_range: 5.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.40        # same as local_costmap (inscribed ~0.20 + margin)
        cost_scaling_factor: 3.0
  global_costmap_client:
    ros__parameters:
      use_sim_time: false
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

# -----------------------------------------------------------------------------
# CONTROLLER SERVER  --  DWB, configured HOLONOMIC
# NOTE: Foxy has NO MPPI and NO Regulated Pure Pursuit (those arrived in Galactic+
# / Humble). DWB (dwb_core::DWBLocalPlanner, pkg nav2_dwb_controller) is the
# holonomic-capable choice here. The G1 commands vx, vy AND vyaw, so we sample
# all three (vy_samples > 0) -- a differential-drive DWB setup would throw away
# the strafe DOF.
# -----------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0       # Hz; control loop
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true

      # --- velocity / acceleration limits (HOLONOMIC) ----------------------
      # These mirror config/robot.yaml (the dashboard's REAL, tested teleop caps:
      # max_vx 1.5, max_vy 0.7, max_vyaw 2.0). RESEARCH NOTE: Unitree only
      # publishes a 2.0 m/s rated forward speed (~1.5 practical); lateral & yaw
      # are NOT published, so robot.yaml's tested values are the ground truth.
      # For AUTONOMOUS nav consider capping forward lower (e.g. 1.0) until proven.
      min_vel_x: -1.5
      max_vel_x: 1.5                  # m/s   (robot.yaml max_vx; rated 2.0, practical ~1.5)
      min_vel_y: -0.7
      max_vel_y: 0.7                  # m/s   (robot.yaml max_vy; not Unitree-published, tested teleop value)
      min_vel_theta: -2.0
      max_vel_theta: 2.0             # rad/s (robot.yaml max_vyaw; tested teleop value); see min_speed_theta
      max_speed_xy: 1.66             # m/s   sqrt(max_vx^2+max_vy^2); cap on combined translational speed
      min_speed_xy: 0.0
      min_speed_theta: 0.0

      # acceleration limits  <ASK ENRICO: real comfortable accel/decel for the G1
      # gait -- placeholders below; too high will command jerky gait, too low = sluggish>
      acc_lim_x: 1.0
      acc_lim_y: 0.6
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: -0.6
      decel_lim_theta: -2.0

      # --- trajectory sampling (HOLONOMIC: ALL THREE > 0) ------------------
      vx_samples: 20
      vy_samples: 10                 # > 0  => holonomic strafe is sampled
      vtheta_samples: 20
      sim_time: 1.5                  # s; trajectory rollout horizon
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      discretize_by_time: false

      # --- critics (holonomic-appropriate) ---------------------------------
      # RotateToGoal/Oscillation can be over-eager for a holonomic base; the set
      # below favors goal/path alignment + obstacle avoidance. Tune with the robot.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      Oscillation.scale: 1.0

# -----------------------------------------------------------------------------
# PLANNER SERVER  --  GridBased / NavFn (fine for short LOCAL goals)
# -----------------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5                 # m; accept a plan ending within this of the goal
      use_astar: false               # false = Dijkstra (NavFn default)
      allow_unknown: true            # map-free: most of the rolling costmap is unknown

# -----------------------------------------------------------------------------
# BT NAVIGATOR  --  the navigate-to-pose behavior tree
# -----------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: camera_init        # FAST-LIO world frame (was odom); map-free
    robot_base_frame: body           # FAST-LIO robot frame (was base_link)
    odom_topic: /Odometry            # PINNED: FAST-LIO odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: false
    # Use Foxy's default navigate_to_pose BT. <ASK ENRICO: if you want a
    # navigate_through_poses or a custom recovery BT, point default_bt_xml_filename
    # at it; Foxy default is fine for single relative goals.>
    # default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# -----------------------------------------------------------------------------
# RECOVERY / BEHAVIOR SERVER
# NOTE: on Foxy the package/node is called "recoveries_server" (it was renamed to
# "behavior_server" in Galactic+). This block name MUST match the node name used
# in bringup.launch.py and the lifecycle_manager node_names list below
# (recoveries_server), or the param namespace won't resolve and the lifecycle
# bond will fail.
# Spin recovery makes sense for a holonomic base; BackUp + Wait are safe defaults.
# -----------------------------------------------------------------------------
recoveries_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: camera_init        # FAST-LIO world frame (was odom); map-free
    robot_base_frame: body           # FAST-LIO robot frame (was base_link)
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    # <ASK ENRICO: safe recovery rotation/back-up speeds for the G1 gait>
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

# -----------------------------------------------------------------------------
# LIFECYCLE MANAGER  --  brings up & watches the nav servers (autostart)
# NOTE the Foxy node names: planner_server, controller_server, recoveries_server
# (NOT behavior_server), bt_navigator. The two costmaps are lifecycle-managed by
# their parent servers, so they are NOT listed here.
# These node_names MUST match the param block names above AND the Node names in
# bringup.launch.py (the launch passes its own node_names list to the manager;
# keep all three in sync).
# -----------------------------------------------------------------------------
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - recoveries_server
      - bt_navigator
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
