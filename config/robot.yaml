# G1 robot dashboard configuration.
# Single source of truth for tuning -- edit here, no need to touch the code.
# Loaded by scripts/robot_web_controller.py at startup. Speed caps are also
# pushed to the browser on connect, so the UI stays in sync automatically.

network:
  interface: eth0      # DDS network interface to the robot
  domain_id: 0

server:
  host: 0.0.0.0        # listen on all interfaces
  port: 8080

# Velocity caps. G1 is rated ~0.8 m/s forward; raise carefully.
speeds:
  max_vx: 1.5          # m/s   forward / back   (W / S)  -- MUST be a dot, not a comma: YAML reads 1,5 as a string and crashes command_loop
  max_vy: 0.7        # m/s   strafe           (A / D)
  max_vyaw: 2.0        # rad/s rotation          (arrow keys)
  slow_scale: 0.4      # multiplier while holding SHIFT (precise/slow mode)

control:
  send_hz: 30          # command-loop tick rate (Hz) for responsive change detection
  watchdog_timeout: 2.0  # s; stop if the browser goes silent this long
  # Velocity is sent to the robot only on CHANGE plus a low-rate refresh -- NOT
  # every tick. Move() is a blocking RPC; flooding it at 30 Hz saturates the DDS
  # RPC layer and eventually kills movement + starves the camera RPC.
  move_duration_s: 1.0   # robot holds the commanded velocity this long (deadman)
  cmd_resend_hz: 3       # refresh rate that keeps the deadman alive / gait hot

# Motion smoothing: jerk- and acceleration-limited velocity shaping (scripts/cmd_shaper.py).
# The web teleop produces a BINARY target (key down = full speed, up = 0). Feeding that
# step to the gait controller lurches the robot. The shaper ramps the commanded velocity
# with bounded acceleration + jerk so starts/stops/turns ease in and out smoothly. It runs
# on the operator INTENT, BEFORE the obstacle guard -- so the guard's hard safety stop is
# still instantaneous (it zeroes the shaped command downstream). Tune accel UP for snappier
# response, DOWN for gentler. jerk ~3-4x accel gives a smooth S-curve without feeling soggy.
motion:
  enabled: true          # false = pass-through (old instant-step behaviour)
  accel_vx: 1.2          # m/s^2   forward/back acceleration limit (0->1.5 m/s in ~1.3 s)
  accel_vy: 1.0          # m/s^2   strafe acceleration limit
  accel_vyaw: 4.0        # rad/s^2 yaw acceleration limit
  jerk_vx: 4.0           # m/s^3   forward/back jerk limit (S-curve sharpness)
  jerk_vy: 4.0           # m/s^3   strafe jerk limit
  jerk_vyaw: 16.0        # rad/s^3 yaw jerk limit
  normalize_diagonal: true  # cap W+A so diagonal speed stays on the (vx,vy) speed ellipse

# Optional SDK gait tuning (set on the robot via the LocoClient when entering walk).
# BOTH default null = leave the controller's built-in defaults untouched. These are
# UNVERIFIED on this robot: discover the valid range FIRST on the real G1 (e.g. read the
# current value back) before setting, and test on the gantry -- a bad value can change
# foot clearance / posture and affect stability. Smoothness primarily comes from `motion`
# above; these are a secondary lever to reduce foot scuffing / adjust stance.
gait:
  swing_height: null     # foot swing height (m), LocoClient SET_SWING_HEIGHT (api 7103). null = default.
  stand_height: null     # stand height (m), LocoClient.SetStandHeight (api 7104). null = default.

camera:
  stream_hz: 25          # head-camera FPS (1080p ~121KB/frame). 30 = smoother but
                         # ~3.6 MB/s of WiFi; lower to 15 if the feed lags.

lidar:
  stream_hz: 10          # cloud updates/s served to the browser
  max_points: 25000      # cap points per frame (perf)
  camera_height_m: 1.3   # head-camera height; aligns the floor to the grid


map:
  dir: maps              # saved maps go here (under the project root)
  voxel_size_m: 0.05     # map resolution (smaller = denser, bigger files)
  max_points: 300000     # cap on accumulated map size
  max_range_m: 4.0       # (legacy, unused) was for the old depth-based mapper
  yaw_sign: 1            # (legacy, unused) the FAST-LIO mapper fixes the frame properly

# Mapping is now real SLAM (FAST-LIO on the head Mid-360), run ON-DEMAND only
# while recording. Start/Stop Mapping in the dashboard spawn/stop this launch.
mapping:
  run_cmd: /home/unitree/g1_mapping_ws/run_mapping.sh
