# G1 robot dashboard configuration.
# Single source of truth for tuning -- edit here, no need to touch the code.
# Loaded by scripts/robot_web_controller.py at startup. Speed caps are also
# pushed to the browser on connect, so the UI stays in sync automatically.

network:
  interface: eth0      # DDS network interface to the robot
  domain_id: 0

server:
  host: 0.0.0.0        # listen on all interfaces
  port: 8080

# Velocity caps. G1 is rated ~0.8 m/s forward; raise carefully.
speeds:
  max_vx: 1.5          # m/s   forward / back   (W / S)  -- MUST be a dot, not a comma: YAML reads 1,5 as a string and crashes command_loop
  max_vy: 0.7        # m/s   strafe           (A / D)
  max_vyaw: 2.0        # rad/s rotation          (arrow keys)
  slow_scale: 0.4      # multiplier while holding SHIFT (precise/slow mode)

control:
  send_hz: 30          # command-loop tick rate (Hz) for responsive change detection
  watchdog_timeout: 2.0  # s; stop if the browser goes silent this long
  # Velocity is sent to the robot only on CHANGE plus a low-rate refresh -- NOT
  # every tick. Move() is a blocking RPC; flooding it at 30 Hz saturates the DDS
  # RPC layer and eventually kills movement + starves the camera RPC.
  move_duration_s: 1.0   # robot holds the commanded velocity this long (deadman)
  cmd_resend_hz: 3       # refresh rate that keeps the deadman alive / gait hot

# Motion smoothing: jerk- and acceleration-limited velocity shaping (scripts/cmd_shaper.py).
# The web teleop produces a BINARY target (key down = full speed, up = 0). Feeding that
# step to the gait controller lurches the robot. The shaper ramps the commanded velocity
# with bounded acceleration + jerk so starts/stops/turns ease in and out smoothly. It runs
# on the operator INTENT, BEFORE the obstacle guard -- so the guard's hard safety stop is
# still instantaneous (it zeroes the shaped command downstream). Tune accel UP for snappier
# response, DOWN for gentler. jerk ~3-4x accel gives a smooth S-curve without feeling soggy.
motion:
  enabled: true          # false = pass-through (old instant-step behaviour)
  accel_vx: 2.2          # m/s^2   forward/back acceleration limit (0->1.5 m/s in ~0.7 s). Was 1.2 = too soggy/laggy; nav2 diff-drive default is 2.5.
  accel_vy: 1.6          # m/s^2   strafe acceleration limit (was 1.0)
  accel_vyaw: 4.0        # rad/s^2 yaw acceleration limit
  jerk_vx: 8.0           # m/s^3   forward/back jerk limit (S-curve sharpness; ~3.6x accel keeps it smooth but snappy at onset. Was 4.0)
  jerk_vy: 8.0           # m/s^3   strafe jerk limit (was 4.0)
  jerk_vyaw: 16.0        # rad/s^3 yaw jerk limit
  normalize_diagonal: true  # cap W+A so diagonal speed stays on the (vx,vy) speed ellipse

# Optional SDK gait tuning (set on the robot via the LocoClient when entering walk).
# BOTH default null = leave the controller's built-in defaults untouched. These are
# UNVERIFIED on this robot: discover the valid range FIRST on the real G1 (e.g. read the
# current value back) before setting, and test on the gantry -- a bad value can change
# foot clearance / posture and affect stability. Smoothness primarily comes from `motion`
# above; these are a secondary lever to reduce foot scuffing / adjust stance.
gait:
  swing_height: null     # foot swing height (m), LocoClient SET_SWING_HEIGHT (api 7103). null = default.
  stand_height: null     # stand height (m), LocoClient.SetStandHeight (api 7104). null = default.

# Discrete-step pacing (scripts/step_pacer.py): genuinely SMALL/MEDIUM stutter-steps
# for tight spaces, in EVERY direction (fwd/back/strafe/rotate). The SDK has NO
# stride/cadence knob -- lowering vx only lowers the gait CADENCE, not the step SIZE.
# The pacer chops the held velocity intent into a short ON burst + a long OFF settle
# so the onboard planner takes ONE short, fully-settled step per burst.
#
# WHERE: command_loop runs  intent -> shaper.normalize -> pacer.modulate -> guard.apply
#        -> shaper.shape. The pacer is UPSTREAM of the guard so the obstacle hard-stop
#        always wins; it NEVER sets the shaper bypass, so each square pulse edge is
#        jerk/accel-limited into an executable trapezoid.
# STRIDE is the SHAPED distance integral (area under the trapezoid), NOT the commanded
#        peak -- so mag_frac is only the commanded fraction; the realized step is
#        smaller. TUNE on the gantry by MEASURED odom displacement per pulse.
# off_s is the single most SAFETY-CRITICAL param: it is the foot-plant/settle window.
#        Keep it LONG (>= one full plant, the robot must reach double-stance) and
#        shorten ONLY after gantry validation shows no stumble. Combined motion
#        (diagonal / translate+turn) uses the MAX on_s/off_s of the demanded axes.
# DEFAULT mode is 'continuous' = today's analog walking, UNCHANGED, until the operator
#        selects Small/Medium in the dashboard. distance_quantize and swing_height are
#        OFF/null until validated on the real robot.
step:
  enabled: true            # master kill-switch: false = pacer is an unconditional no-op
  default_mode: continuous # startup mode; MUST be 'continuous' (== pass-through, today's behaviour)
  distance_quantize: true  # ENABLED to control STRIDE: ends the ON burst at `target` m of MEASURED
                           # odom travel, so each step is ~target instead of 1.5-2.25x over (fixed timer).
                           # This is the ONLY server-side stride knob (SDK has none). GANTRY-VALIDATE:
                           # auto-falls-back to time-based when odom is stale (watch step_estimated).
  drive_timeout_s: 1.5     # distance-mode backstop: the ON window can never hang open longer than this
  idle_eps: 0.001          # |intent|>this on an axis == the operator is holding that direction
  # SETTLE GATE: a burst only (re)starts once the SHAPER's realized velocity has fallen
  # below these on every demanded axis (foot planted) -- off_s below is just the MINIMUM.
  # This makes steps DISCRETE regardless of the shaper's accel/jerk gains and keeps a
  # diagonal's axes phase-locked. off_max_s is the backstop so it can never hang.
  settle_eps_lin: 0.03     # m/s   vx/vy "stopped" threshold for the settle gate
  settle_eps_ang: 0.08     # rad/s vyaw "stopped" threshold
  off_max_s: 2.0           # max OFF wait for settle before forcing the next burst
  # Per-mode SWING HEIGHT (foot lift, m) via SET_SWING_HEIGHT.
  # DISABLED (null): on THIS robot's firmware the SET_SWING_HEIGHT RPC HANGS (it logged
  # nothing and never returned), and because the command client is shared a hung call
  # disrupts the velocity RPCs -> the robot walks strangely / won't go straight or
  # backward. So swing-height shuffle is OFF; the per-mode swing_height values below are
  # ignored while this is null, and Normal/Medium use the robot's NATIVE foot lift
  # (untouched). Re-enable (set a value) only if a firmware update makes api 7103 respond.
  swing_height_normal: null  # null = feature OFF (api hangs on this robot)
  # mag_frac = the BURST VELOCITY (fraction of the axis cap). It MUST exceed the robot's
  # minimum stepping speed or the controller just sways in place = a STALL, not a small
  # step. THIS is the knob to RAISE if a mode stalls. on_s lets the jerk-limited shaper
  # ramp into the stepping range; lower on_s -> smaller (but slower-moving) step. The
  # smallest reliable velocity-pulsed step is ~0.2 m (V_min_step * one step period), so
  # "small" is ~0.2 m, not 0.1. Strafe (vy) is slower so it needs a HIGHER frac. off_s is
  # only the settle minimum (the gate extends it). TUNE on the gantry; these are starting
  # points biased toward "actually steps", not toward a tiny stride.
  small:                   # smallest discrete steps for tight maneuvering
    # The realized burst peak is ACCEL-limited by on_s (mag is above the cap), so on_s sets
    # the step speed. on_s 0.44 (~0.34 m/s) was TOO SLOW -> half-step + rock back to
    # rebalance. on_s 0.50 (~0.44 m/s) completes the weight transfer CLEANLY (confirmed).
    # That is about the floor for a clean velocity-pulsed step. To go FASTER raise on_s a
    # touch (0.52-0.55); if it ever half-steps again, raise on_s, do NOT lower it.
    # SMALL = short STRIDE (little ground per step), the climb-mode feel. With
    # distance_quantize:true (above) the ON burst ENDS the instant odom shows `target` m of
    # real travel -> the stride is ~target instead of 1.5-2.25x over. `target` is THE stride
    # knob now (off_s is back to short -> it only sets cadence, not stride). HARD FLOOR: the
    # onboard walk controller's minimum step is ~0.2 m, so targets below that just hit the
    # floor -- climb-mode-tiny is NOT reachable from walk-mode velocity (swing_height, the
    # sub-floor lever, is disabled: SET_SWING_HEIGHT hangs on this firmware). Lower `target`
    # to shorten the stride down to that floor; raise it for longer steps.
    vx:   { mag_frac: 0.48, on_s: 0.54, off_s: 0.45, target: 0.18 }  # ~0.2 m stride (near the floor)
    vy:   { mag_frac: 0.62, on_s: 0.55, off_s: 0.50, target: 0.13 }  # strafe (shorter axis)
    vyaw: { mag_frac: 0.65, on_s: 0.42, off_s: 0.44, target: 0.18 }  # rotate ~0.18 rad (~10 deg) per step
    swing_height: 0.06     # SHUFFLE: lower foot lift than normal (0.10) so a smaller step
                           # completes cleanly. Raise toward 0.10 if it toe-scuffs; this is
                           # the lever for going below the ~0.29 m velocity floor.
  medium:                  # discrete medium steps
    vx:   { mag_frac: 0.55, on_s: 0.60, off_s: 0.45, target: 0.35 }  # ~0.6 m/s burst
    vy:   { mag_frac: 0.75, on_s: 0.60, off_s: 0.50, target: 0.28 }
    vyaw: { mag_frac: 0.95, on_s: 0.46, off_s: 0.42, target: 0.35 }  # rotate: ~1.5 rad/s rate
    swing_height: null
  # phase_sync: reserved future v3 toggle (gait-phase-synchronized bursts). GET_PHASE is
  #             deprecated/unwrapped on G1 -> stays OFF; documented only, not wired in v1.

camera:
  stream_hz: 25          # head-camera FPS (1080p ~121KB/frame). 30 = smoother but
                         # ~3.6 MB/s of WiFi; lower to 15 if the feed lags.

lidar:
  stream_hz: 10          # cloud updates/s served to the browser
  max_points: 25000      # cap points per frame (perf)
  camera_height_m: 1.3   # head-camera height; aligns the floor to the grid


map:
  dir: maps              # saved maps go here (under the project root)
  voxel_size_m: 0.05     # map resolution (smaller = denser, bigger files)
  max_points: 300000     # cap on accumulated map size

# Mapping is now real SLAM (FAST-LIO on the head Mid-360), run ON-DEMAND only
# while recording. Start/Stop Mapping in the dashboard spawn/stop this launch.
mapping:
  run_cmd: /home/unitree/g1_mapping_ws/run_mapping.sh
