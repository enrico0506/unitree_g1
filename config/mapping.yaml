# ============================================================================
# G1 EDU U6 — Remote control and FSM mapping
# ============================================================================
# Discovered empirically by reading rt/wirelesscontroller and watching
# LocoClient.GetFsmId() responses with scripts/read_state.py and
# scripts/remote_mapper.py.
#
# Robot:    Unitree G1 EDU U6
# Location: MyBotShop IEA
# Owner:    Enrico
# Last updated: 2026-05-28
# ============================================================================


# ----------------------------------------------------------------------------
# REMOTE BUTTONS
# ----------------------------------------------------------------------------
# Each physical button on the Unitree remote toggles one bit in the
# WirelessController_.keys uint16. Map: bit index -> human-readable name.
# Verified by pressing each button individually with remote_mapper.py.
# ----------------------------------------------------------------------------
remote_keys:
  # ---- Verified ----
  0:  R1            # top-right shoulder
  1:  L1            # top-left shoulder
  4:  R2            # bottom-right shoulder
  5:  L2            # bottom-left shoulder
  8:  A             # face button
  9:  B             # face button
  10: X             # face button
  11: Y             # face button
  12: up            # D-pad up
  13: left          # D-pad left
  14: down          # D-pad down
  15: right         # D-pad right

  # ---- NOT YET VERIFIED — press these and update ----
  2:  start?        # likely "start"
  3:  select?       # likely "select"
  6:  F1?           # likely "F1"
  7:  F2?           # likely "F2"


# ----------------------------------------------------------------------------
# FSM MODES
# ----------------------------------------------------------------------------
# IDs returned by LocoClient.GetFsmId(). Update as you observe transitions.
# Numbers below are the common Unitree G1 defaults — confirm with read_state.py
# before trusting them.
# ----------------------------------------------------------------------------
fsm_modes:
  0:
    name: zero_torque
    description: Motors off, robot limp. Hold robot before entering.
    verified: false

  1:
    name: damping
    description: Soft hold. Safest powered state. Usually the boot state.
    verified: false

  2:
    name: get_ready
    description: Squat / get-ready pose, partial torque.
    verified: false

  3:
    name: lock_stand
    description: Locked-knee stand, low power.
    verified: false

  4:
    name: stand
    description: Active balancing stand, knees bent.
    verified: false

  200:
    name: main_control
    description: Locomotion mode active, robot can walk via sticks.
    verified: false


# ----------------------------------------------------------------------------
# REMOTE COMBOS — FSM TRIGGERS
# ----------------------------------------------------------------------------
# Combos observed via remote_mapper.py. Mark `triggers_fsm` only after you
# confirm with read_state.py that fsm_id actually changes when pressed.
#
# Format:
#   combo_name:
#     bits:         list of bit indices that must be set
#     hex:          combined bitmask (for quick reference)
#     observed:     true if you've seen the combo on the wire
#     triggers_fsm: target fsm_id, or null if no transition observed
#     notes:        anything useful
# ----------------------------------------------------------------------------
remote_combos:
  L2+Y:
    bits: [5, 11]
    hex: 0x0820
    observed: true
    triggers_fsm: null    # update after testing with read_state.py
    notes: ""

  L2+B:
    bits: [5, 9]
    hex: 0x0220
    observed: true
    triggers_fsm: null    # Unitree convention: usually damping (fsm_id=1)
    notes: "Conventionally maps to damping on G1."

  L2+up:
    bits: [5, 12]
    hex: 0x1020
    observed: true
    triggers_fsm: null
    notes: ""

  R2+A:
    bits: [4, 8]
    hex: 0x0110
    observed: true
    triggers_fsm: null
    notes: ""

  # ---- Combos NOT yet tested, but worth trying ----
  L2+A:
    bits: [5, 8]
    hex: 0x0120
    observed: false
    triggers_fsm: null    # Unitree convention: usually stand-up (fsm_id=4)
    notes: "Try with robot supported — likely stand-up."

  L2+X:
    bits: [5, 10]
    hex: 0x0420
    observed: false
    triggers_fsm: null
    notes: ""

  start:
    bits: [2]
    hex: 0x0004
    observed: false
    triggers_fsm: null    # Unitree convention: enter main control (200)
    notes: "Conventionally enters locomotion mode."

  select:
    bits: [3]
    hex: 0x0008
    observed: false
    triggers_fsm: null
    notes: ""


# ----------------------------------------------------------------------------
# ARM GESTURES — SDK action ids (G1ArmActionClient, service "arm")
# ----------------------------------------------------------------------------
# Canonical full action catalog (mirrors action_map in the SDK at
# unitree_sdk2py/g1/arm/g1_arm_action_client.py). The dashboard wires only a
# subset (scripts/robot_web_controller.py ARM_GESTURES); this is the reference.
# Call via: c = G1ArmActionClient(); c.SetTimeout(3.0); c.Init(); c.ExecuteAction(<id>)
# Hold-poses (hands_up, hug, heart, high_five, …) must be returned to neutral
# with release_arm (99); the dashboard auto-releases them after a few seconds
# (and toggles hands_up on a second press). Verified on Enrico's G1 2026-06-23.
# ----------------------------------------------------------------------------
arm_gestures:
  release_arm:    99   # return arms to neutral (clears any held pose)
  two_hand_kiss:  11
  left_kiss:      12
  right_kiss:     13
  hands_up:       15   # palm-up raise; dashboard toggles it with release_arm
  clap:           17
  high_five:      18
  hug:            19
  heart:          20
  right_heart:    21
  reject:         22
  right_hand_up:  23
  x_ray:          24
  face_wave:      25
  high_wave:      26
  shake_hand:     27

# Which remote double-tap maps to which gesture (observed on the remote).
remote_gestures:
  double_A: clap            # bit 8  — "press A twice fast -> claps"
  double_Y: high_wave       # bit 11 — "double Y -> waves hand"
  double_X: two_hand_kiss   # bit 10 — "double X -> blows a kiss"
  double_B: hands_up        # bit 9  — "double B -> hand up, palm up; press again to lower"


# ----------------------------------------------------------------------------
# WHOLE-BODY MODE COMBOS
# ----------------------------------------------------------------------------
# These combos switch the robot into a whole-body behavior mode (NOT an arm
# animation), so they are driven by an FSM id, not the arm service. The
# dashboard mode button is a one-liner: client.SetFsmId(<fsm_id>).
# fsm_ids below were captured on the real robot (scripts/capture_combo_fsm.py).
# ----------------------------------------------------------------------------
mode_combos:
  climb:
    combo: R2+B
    bits: [4, 9]
    hex: 0x0210
    observed: true
    fsm_id: 812           # captured 2026-06-23: 802 (main_control) -> 812 -> back to 802
    notes: "Stair / obstacle climb mode. 8xx = locomotion family (next to 802). Enter from walk."
  dance:
    combo: R1+B
    bits: [0, 9]
    hex: 0x0201
    observed: true
    fsm_id: 503           # captured 2026-06-23: 802 (main_control) -> 503 -> back to 802
    notes: "Built-in dance routine. Plays, then returns to main_control on its own. Enter from walk."
  sit:
    combo: ""
    observed: false
    fsm_id: null          # capture with scripts/capture_combo_fsm.py, then the Setup button enables
    notes: "Sit posture (Setup tab). Part of the safe power-down / posture sequence."
  lay:
    combo: ""
    observed: false
    fsm_id: null          # capture with scripts/capture_combo_fsm.py, then the Setup button enables
    notes: "Lie-down posture (Setup tab). Part of the safe power-down / posture sequence."


# ----------------------------------------------------------------------------
# NETWORK
# ----------------------------------------------------------------------------
network:
  robot_ip: 192.168.123.161
  robot_subnet: 192.168.123.0/24
  laptop_interface_hint: eth0   # auto-detected in scripts/read_state.py


# ----------------------------------------------------------------------------
# SDK NOTES
# ----------------------------------------------------------------------------
sdk:
  lowstate_topic: rt/lowstate
  lowstate_type:  unitree_sdk2py.idl.unitree_hg.msg.dds_.LowState_
  remote_topic:   rt/wirelesscontroller
  remote_type:    unitree_sdk2py.idl.unitree_go.msg.dds_.WirelessController_
  fsm_query:      LocoClient.GetFsmId()
  fsm_topic_note: |
    G1 does NOT publish FSM state on rt/sportmodestate the way Go2 does.
    The unitree_hg.msg.dds_ namespace has no SportModeState_ at all.
    Read FSM only via LocoClient.GetFsmId().